<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оракул — Шар Предсказаний</title>
    <style>
        /* ===== БАЗА ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            min-height: 100vh;
            background: #0a0615;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ===== ВЕДЬМА ЧЕРЕЗ <img> ===== */
        .witch-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            object-fit: cover;      /* заполняет весь экран */
            object-position: center bottom; /* ведьма снизу */
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ===== ЗАТЕМНЕНИЕ ПОВЕРХ ВЕДЬМЫ ===== */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: radial-gradient(ellipse at center, rgba(10, 6, 21, 0.1) 0%, rgba(10, 6, 21, 0.6) 100%);
            pointer-events: none;
        }

        /* ===== ЗВЁЗДЫ ===== */
        .stars {
            position: fixed;
            inset: 0;
            z-index: 3;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle ease-in-out infinite alternate;
        }

        .star:nth-child(1) { top: 10%; left: 5%; animation-duration: 2s; }
        .star:nth-child(2) { top: 15%; left: 20%; animation-duration: 3.5s; width: 3px; height: 3px; }
        .star:nth-child(3) { top: 8%; left: 40%; animation-duration: 2.8s; }
        .star:nth-child(4) { top: 25%; left: 75%; animation-duration: 4s; }
        .star:nth-child(5) { top: 12%; left: 90%; animation-duration: 2.2s; width: 1px; height: 1px; }
        .star:nth-child(6) { top: 40%; left: 2%; animation-duration: 3s; }
        .star:nth-child(7) { top: 45%; left: 95%; animation-duration: 3.8s; width: 3px; height: 3px; }
        .star:nth-child(8) { top: 60%; left: 8%; animation-duration: 2.5s; }
        .star:nth-child(9) { top: 70%; left: 85%; animation-duration: 3.2s; }
        .star:nth-child(10) { top: 85%; left: 15%; animation-duration: 2.7s; }
        .star:nth-child(11) { top: 90%; left: 50%; animation-duration: 4.2s; width: 1px; height: 1px; }
        .star:nth-child(12) { top: 50%; left: 50%; animation-duration: 3.6s; }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px 30px;
            animation: fadeIn 1.5s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== ВЕРХНЯЯ СТРОКА ===== */
        .question-section {
            width: 100%;
            max-width: 580px;
            text-align: center;
            z-index: 20;
            flex-shrink: 0;
            padding-top: 10px;
        }

        .question-section label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 14px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 300;
            text-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        .input-row {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.4s ease;
        }

        .input-row:focus-within {
            border-color: rgba(150, 80, 255, 0.4);
            box-shadow: 0 0 60px rgba(150, 80, 255, 0.08);
        }

        .input-row input {
            flex: 1;
            padding: 16px 26px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            font-family: 'Georgia', serif;
            outline: none;
            font-weight: 300;
        }

        .input-row input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-style: italic;
        }

        .input-row button {
            padding: 16px 34px;
            background: linear-gradient(135deg, #6c2bd9, #9b4dff);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            white-space: nowrap;
            font-family: 'Segoe UI', sans-serif;
        }

        .input-row button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(150, 80, 255, 0.4);
        }

        /* ===== ШАР ===== */
        .visual-block {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ball-wrapper {
        position: relative;
        z-index: 10;
        width: 550px;
        height: 550px;
        animation: floatBall 4s ease-in-out infinite;
        margin-top: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
}

       @keyframes floatBall {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
}

/* ===== PNG-ШАР ===== */
.ball-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    filter: drop-shadow(0 0 60px rgba(150, 80, 255, 0.25));
    transition: filter 0.5s ease;
}

/* ===== СВЕЧЕНИЕ ПРИ ОТВЕТЕ ===== */
.ball-wrapper.glow .ball-img {
    filter: drop-shadow(0 0 100px rgba(150, 80, 255, 0.7)) 
            drop-shadow(0 0 200px rgba(150, 80, 255, 0.3));
}

/* ===== ТЕКСТ ПОВЕРХ ШАРА ===== */
.ball-text {
    position: absolute;
    z-index: 5;
    color: rgba(255, 255, 255, 0.95);
    font-size: 1.5rem;
    text-align: center;
    padding: 20px;
    font-family: 'Georgia', serif;
    font-style: italic;
    line-height: 1.5;
    text-shadow: 
        0 0 40px rgba(150, 80, 255, 0.6),
        0 0 80px rgba(0, 0, 0, 0.8);
    opacity: 0;
    transform: scale(0.7);
    transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 75%;
    word-wrap: break-word;
    pointer-events: none;
}

.ball-text.show {
    opacity: 1;
    transform: scale(1);
}

/* ===== ТРЯСКА ===== */
.ball-wrapper.shake {
    animation: shakeBall 0.6s ease-in-out !important;
}

@keyframes shakeBall {
    0% { transform: translateY(0) rotate(0deg); }
    15% { transform: translateY(-14px) rotate(-7deg); }
    30% { transform: translateY(8px) rotate(7deg); }
    45% { transform: translateY(-10px) rotate(-5deg); }
    60% { transform: translateY(6px) rotate(5deg); }
    80% { transform: translateY(-5px) rotate(-3deg); }
    100% { transform: translateY(0) rotate(0deg); }
}

/* ===== ПОДПИСЬ ===== */
.ball-hint {
    position: absolute;
    bottom: 42px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.12);
    font-size: 0.65rem;
    letter-spacing: 4px;
    font-family: 'Segoe UI', sans-serif;
    text-transform: uppercase;
    white-space: nowrap;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
}

  /* ===== АДАПТИВ ===== */
@media (max-width: 768px) {
    .container {
        padding: 20px 16px 20px;
        max-height: 100vh;
        justify-content: flex-start;
        gap: 0;
    }

    .question-section {
        padding-top: 15px;
    }

    .question-section label {
        font-size: 0.65rem;
        letter-spacing: 3px;
        margin-bottom: 10px;
    }

    .input-row input {
        padding: 12px 16px;
        font-size: 0.9rem;
    }

    .input-row button {
        padding: 12px 20px;
        font-size: 0.75rem;
        letter-spacing: 1px;
    }

    .ball-wrapper {
        width: 240px;
        height: 240px;
        margin-top: -30px;
    }

    .ball-text {
        font-size: 1rem;
        padding: 16px;
    }

    .ball-hint {
        font-size: 0.55rem;
        bottom: -36px;
    }
}

@media (max-width: 480px) {
    .container {
        padding: 12px 10px 12px;
    }

    .question-section label {
        font-size: 0.55rem;
        letter-spacing: 2px;
    }

    .input-row {
        flex-direction: column;
        background: transparent;
        padding: 0;
        border: none;
        gap: 8px;
        border-radius: 0;
        backdrop-filter: none;
    }

    .input-row input {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 30px;
        padding: 12px 18px;
        text-align: center;
        font-size: 0.85rem;
    }

    .input-row input:focus {
        border-color: rgba(150, 80, 255, 0.3);
    }

    .input-row button {
        padding: 12px;
        width: 100%;
        border-radius: 30px;
        font-size: 0.7rem;
    }

    .ball-wrapper {
        width: 180px;
        height: 180px;
        margin-top: 10px;
    }

    .ball-text {
        font-size: 0.8rem;
        padding: 14px;
        max-width: 70%;
    }

    .ball-hint {
        display: none;
    }
}

@media (max-width: 380px) {
    .ball-wrapper {
        width: 150px;
        height: 150px;
        margin-top: 20px;
    }

    .ball-text {
        font-size: 0.7rem;
        padding: 10px;
        max-width: 65%;
    }
}

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0615;
        }
        ::-webkit-scrollbar-thumb {
            background: #6c2bd9;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- ===== ВЕДЬМА ЧЕРЕЗ <img> НА ВЕСЬ ЭКРАН ===== -->
    <img 
        class="witch-bg" 
        src="NewCanvas1.png" 
        alt="Ведьма-оракул"
    >

    <!-- ===== ЗАТЕМНЕНИЕ ===== -->
    <div class="overlay"></div>

    <!-- ===== ЗВЁЗДЫ ===== -->
    <div class="stars">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>

    <!-- ===== КОНТЕЙНЕР ===== -->
    <div class="container">

        <div class="question-section">
            <label for="questionInput">❖ Задай вопрос Вселенной ❖</label>
            <div class="input-row">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Напиши свой вопрос..."
                    autocomplete="off"
                >
                <button id="askBtn">Спросить</button>
            </div>
        </div>

        <div class="visual-block">
    <div class="ball-wrapper" id="ballWrapper">
        
        <!-- PNG-ШАР -->
        <img 
            class="ball-img" 
            src="1.png" 
            alt="Магический шар"
            id="ballImg"
        >

        <!-- ТЕКСТ ПОВЕРХ ШАРА -->
        <span class="ball-text" id="ballText"></span>
        
        <span class="ball-hint">✦ коснись ✦</span>
    </div>
</div>

    </div>

    <script>
        (function() {
            const input = document.getElementById('questionInput');
            const button = document.getElementById('askBtn');
            const ballWrapper = document.getElementById('ballWrapper');
            const ballText = document.getElementById('ballText');

            const predictions = [
                'Звёзды говорят: «Да»',
                'Будет, но не сразу',
                'Ответ — в твоём сердце',
                'Вселенная улыбается тебе',
                'Ты на правильном пути',
                'Возможность уже рядом',
                'Повремени с решением',
                'Судьба готовит сюрприз',
                'Твоя интуиция не врёт',
                'Это начало большого пути',
                'Верь в свои силы',
                'Магия вокруг тебя',
                'Ответ придёт во сне',
                'Ты уже всё знаешь',
                'Вселенная ждёт твоего шага',
                'Скоро всё изменится',
                'Доверься потоку',
                'Это знак — действуй!',
                'Терпение принесёт плоды',
                'Твой вопрос услышан'
            ];

            let isAnswering = false;

            function getPrediction() {
                return predictions[Math.floor(Math.random() * predictions.length)];
            }

            function showPrediction() {
                if (isAnswering) return;
                const question = input.value.trim();

                const text = question === '' 
                    ? 'Задай свой вопрос...' 
                    : getPrediction();

                isAnswering = true;
                ballWrapper.classList.remove('glow');
                ballText.classList.remove('show');
                ballText.textContent = '';

                ballWrapper.classList.add('shake');

                setTimeout(() => {
                    ballWrapper.classList.remove('shake');
                    
                    ballText.textContent = text;
                    ballText.classList.add('show');
                    ballWrapper.classList.add('glow');

                    isAnswering = false;
                }, 700);
            }

            button.addEventListener('click', showPrediction);

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    showPrediction();
                }
            });

            input.addEventListener('input', () => {
                if (ballText.classList.contains('show')) {
                    ballText.classList.remove('show');
                    ballWrapper.classList.remove('glow');
                }
            });

            ballWrapper.addEventListener('click', () => {
                if (!input.value.trim()) {
                    input.focus();
                    return;
                }
                showPrediction();
            });

        })();
    </script>

</body>
</html>
